- name: Reload Caddy unit
  ansible.builtin.systemd:
    daemon_reload: yes

- name: Restart Caddy
  systemd:
    name: caddy
    state: restarted
    daemon_reload: yes
  listen: "reload caddy"
  when: caddy_admin_off | default(true)

- name: Reload Caddy
  ansible.builtin.systemd:
    name: caddy
    state: reloaded
    daemon_reload: yes
  listen: "reload caddy"
  when: not caddy_admin_off | default(true) | bool
