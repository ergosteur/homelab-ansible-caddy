- name: Verify proxied sites
  block:
    - name: "Smoke test: Check if sites are responding"
      ansible.builtin.uri:
        url: "http://127.0.0.1"
        headers:
          Host: "{{ (item.domain is string) | ternary(item.domain, item.domain | first) | replace('*.', 'test.') }}"
        validate_certs: no
        status_code: 
          - 200
          - 301
          - 302
          - 400
          - 401
          - 404 # Some sites might return 404 by design if no backend is configured for the root
          - 418 # Accept teapot code for intentionally disabled sites
        timeout: 10
      loop: "{{ caddy_sites }}"
      # Skip wildcards that aren't easily testable without a specific subdomain, 
      # or sites that are just redirects where we might expect 301/302.
      register: site_smoke_results
      ignore_errors: yes

    - name: Display verification results
      ansible.builtin.debug:
        msg: >-
          Site: {{ (item.item.domain is string) | ternary(item.item.domain, item.item.domain | first) }}
          Status: {{ item.status | default('FAILED') }}
          URL: {{ item.url | default('N/A') }}
      loop: "{{ site_smoke_results.results }}"
      loop_control:
        label: "{{ (item.item.domain is string) | ternary(item.item.domain, item.item.domain | first) }}"

    - name: Generate CSV report
      delegate_to: localhost
      run_once: yes
      ansible.builtin.copy:
        content: |
          "Host","Domain","Upstream","Status","URL","Message"
          {% for host in ansible_play_hosts %}
          {% for result in hostvars[host]['site_smoke_results']['results'] %}
          {% set item = result.item %}
          {% if item.upstream is defined and item.upstream %}{% set upstream = item.upstream %}
          {% elif item.upstreams is defined and item.upstreams %}{% set upstream = "Multiple (Paths)" %}
          {% elif item.subdomain_upstreams is defined and item.subdomain_upstreams %}{% set upstream = "Multiple (Subdomains)" %}
          {% elif item.serve_static | default(false) %}{% set upstream = "Static: " ~ (item.root_path | default('/var/www/html')) %}
          {% elif item.redirect is defined and item.redirect %}{% set upstream = "Redirect: " ~ item.redirect.target %}
          {% else %}{% set upstream = "Default/Respond" %}{% endif %}
          "{{ host }}","{{ (item.domain is string) | ternary(item.domain, item.domain | first) }}","{{ upstream }}","{{ result.status | default('FAILED') }}","{{ result.url | default('N/A') }}","{{ result.msg | default('') | replace('"', '""') }}"
          {% endfor %}
          {% endfor %}
        dest: "{{ playbook_dir }}/../../test_report.csv"
        mode: '0644'
