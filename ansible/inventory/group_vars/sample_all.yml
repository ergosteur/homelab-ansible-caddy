# SAMPLE Global Ansible/Caddy defaults
# Copy this to ansible/group_vars/all.yml and customize

ansible_user: ubuntu
ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') + '/.ssh/id_ed25519' }}"

# Default Caddy settings
caddy_admin_email: "admin@example.com"
caddy_admin_off: false
